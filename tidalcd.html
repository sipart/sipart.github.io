:root{
  --wall:#14110f;
  --wall-2:#1c1815;
  --ledge:#2a221c;
  --ledge-hi:#4a3b2f;
  --ink:#f3ede6;
  --ink-dim:#a99f94;
  --ink-faint:#6d645b;
  --panel:#1f1b18;
  --panel-2:#2a2521;
  --line:#3a332d;
  --accent:#ffffff;
  --accent-ink:#14110f;
  --danger:#ff6b5b;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--wall);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--ink)}

/* ---------- App frame ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 0%,#221d19 0%,var(--wall) 60%)}
header{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));flex:none}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.brand small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:11px;letter-spacing:.02em;text-transform:none;color:var(--ink-faint)}
.spacer{flex:1}
.search{position:relative;width:min(280px,34vw)}
.search input{width:100%;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--panel);padding:0 14px 0 38px;outline:none;font-size:15px}
.search input:focus{border-color:var(--ink-faint)}
.search svg{position:absolute;left:13px;top:11px;opacity:.55}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px;height:40px}
.seg button{padding:0 12px;border-radius:16px;font-size:13px;font-weight:600;color:var(--ink-dim);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--ink)}
.icon-btn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);flex:none}
.icon-btn:active{transform:scale(.95)}

/* ---------- Shelves ---------- */
#shelfWrap{flex:1;position:relative;min-height:0}
#shelf{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:auto;
  display:flex;flex-direction:column;justify-content:center;padding:0}
#shelf::-webkit-scrollbar{display:none}
#case{position:relative;flex:none;width:max-content;min-width:100%;padding:var(--case-top) var(--post) 4px;display:flex;flex-direction:column;isolation:isolate}
#case::before,#case::after{content:"";position:absolute;top:0;bottom:0;width:var(--post);z-index:3;
  background:var(--grain-v),linear-gradient(90deg,#6e4528,#9a6a41 30%,#a87749 55%,#7d4f2d 85%,#5a381f);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#case::before{left:0;box-shadow:inset -3px 0 6px rgba(0,0,0,.35),6px 0 14px rgba(0,0,0,.45)}
#case::after{right:0;box-shadow:inset 3px 0 6px rgba(0,0,0,.35),-6px 0 14px rgba(0,0,0,.45)}
#case > .top{position:absolute;left:0;right:0;top:0;height:var(--case-top);z-index:2;
  background:var(--grain),linear-gradient(#5a381f,#8a5b36 45%,#6e4528);box-shadow:0 6px 12px rgba(0,0,0,.5)}
